# Checked in CI (job `deny`, also weekly) with `cargo deny check`; locally: cargo install cargo-deny, then cargo deny check.
# The licences of what the app ships are listed in THIRD_PARTY.md.

# Linux only for now: leave the crates of other platforms out of the checks.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Vulnerabilities and yanked crates fail. "Unmaintained" is reported only for the crates the workspace names itself:
# the ones found today (zbus_names, zvariant, ttf-parser, paste, ...) come in through egui and zbus, not ours to replace.
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # webpki-roots
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1", # the fonts of egui (epaint_default_fonts)
    "Ubuntu-font-1.0", # the same
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Upstream crates pull several versions of the same crate: not ours to unify.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
