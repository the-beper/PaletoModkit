# Pins and identity of the release pipeline: KEY=value, one per line, no quotes.
# The scripts read this file with sed and never source it (RELEASE_CONF points them to another one, for the tests).
# Every pin is bumped by hand (docs/release.md); an empty or malformed pin makes release mode refuse (exit 2).

# Flatpak identity: do not change, users have this remote installed.
