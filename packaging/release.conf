# Flathub commits of the build tools (org.freedesktop.Sdk, its rust-stable and dotnet10 extensions, branch 26.08, x86_64),
# re-check with: flatpak remote-info --user --show-commit flathub org.freedesktop.Sdk//26.08
SDK_COMMIT=a1b744b072d9f55d061e35382547ae80dad8d92abecc1da7dc1818de2daabfd3
