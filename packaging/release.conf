FLATPAK_BRANCH=master
SITE_URL=https://the-beper.github.io/PaletoModkit
GITHUB_REPO=the-beper/PaletoModkit
# Fingerprint of the published Flatpak signing key (no rotation).
FLATPAK_KEY_FPR=FBC1FA631AD56F05322DB693320B3555C885070B

# Build image of the Flatpak build (by digest), re-check with: skopeo inspect --format '{{.Digest}}' docker://<name>:freedesktop-26.08
