app-id: io.github.the_beper.PaletoModkit
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.dotnet10
command: paleto-modkit

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  # Prefix tweaks runs Proton's Wine on the host (flatpak-spawn --host): the sandbox
  # cannot run it (32-bit processes). Drop this to keep the app sandboxed; the tweak then
  # says so and is not offered.
  - --talk-name=org.freedesktop.Flatpak
  - --share=network
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam
  - --filesystem=~/Games
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/paleto-modkit/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  # The Legacy -> Enhanced converter (CodeWalker based), with the .NET runtime
  # bundled; its NuGet packages come from nuget-sources.json
  # (packaging/flatpak-nuget-sources.sh).
  - name: paleto-cwconv
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_NOLOGO: 'true'
    build-commands:
      - dotnet publish tools/cwconv/paleto-cwconv.csproj -c Release -r linux-x64 --self-contained true
        -p:DebugType=none --source ./nuget-sources -o /app/lib/paleto-modkit/cwconv
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - dist
          - screenshots
          - tmp
          - .flatpak-builder
      - nuget-sources.json

  - name: paleto-modkit
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --locked -p paleto-modkit -p paleto-cli
      - install -Dm755 target/release/paleto-modkit /app/bin/paleto-modkit
      - install -Dm755 target/release/paleto /app/bin/paleto
      - install -Dm644 packaging/io.github.the_beper.PaletoModkit.desktop /app/share/applications/io.github.the_beper.PaletoModkit.desktop
      - install -Dm644 packaging/io.github.the_beper.PaletoModkit.metainfo.xml /app/share/metainfo/io.github.the_beper.PaletoModkit.metainfo.xml
      - install -Dm644 packaging/io.github.the_beper.PaletoModkit.mime.xml /app/share/mime/packages/io.github.the_beper.PaletoModkit.xml
      - install -Dm644 packaging/icons/hicolor/scalable/apps/io.github.the_beper.PaletoModkit.svg /app/share/icons/hicolor/scalable/apps/io.github.the_beper.PaletoModkit.svg
      - install -Dm644 packaging/icons/hicolor/symbolic/apps/io.github.the_beper.PaletoModkit-symbolic.svg /app/share/icons/hicolor/symbolic/apps/io.github.the_beper.PaletoModkit-symbolic.svg
      - |
        for s in 16 24 32 48 64 128 256 512; do
          install -Dm644 packaging/icons/hicolor/${s}x${s}/apps/io.github.the_beper.PaletoModkit.png \
            /app/share/icons/hicolor/${s}x${s}/apps/io.github.the_beper.PaletoModkit.png
        done
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - dist
          - screenshots
          - tmp
          - .flatpak-builder
      - cargo-sources.json
