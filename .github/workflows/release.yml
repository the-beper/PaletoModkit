name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag"
        required: true

permissions:
  contents: write

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Tests
        run: cargo test --locked
      - name: Build release artifacts
        run: ./packaging/build-release.sh
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  flatpak:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The build needs the Flathub runtimes (about 12 GB) and a release build of the
      # app: more than the runner has free. It runs on the runner itself, not in a
      # container job, so that this can make room first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          submodules: true
      - name: Use the packaging files from main
        run: git checkout origin/main -- packaging/
      - name: Build the Flatpak bundle
        run: WORK="$RUNNER_TEMP/flatpak" OUT="$PWD" ./packaging/build-flatpak.sh
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: PaletoModkit-x86_64.flatpak
