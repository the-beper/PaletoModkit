name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".claude/**"

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Validate desktop integration files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream libxml2-utils
          desktop-file-validate packaging/io.github.the_beper.PaletoModkit.desktop
          appstreamcli validate --no-net packaging/io.github.the_beper.PaletoModkit.metainfo.xml
          xmllint --noout packaging/io.github.the_beper.PaletoModkit.mime.xml
